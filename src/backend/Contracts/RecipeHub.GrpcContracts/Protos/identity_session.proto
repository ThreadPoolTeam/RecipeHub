syntax = "proto3";
option csharp_namespace = "RecipeHub.GrpcContracts.Identity";
package identity;

service IdentitySession {
  rpc Validate (ValidateSessionRequest) returns (ValidateSessionResponse);
}
message ValidateSessionRequest { string access_token = 1; }
message ValidateSessionResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
  reserved 4;
  reserved "allowed_recipe_ids";
  string display_name = 5;
}
