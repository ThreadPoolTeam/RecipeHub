apiVersion: 1

datasources:
  - name: RecipeHub Audit DB
    uid: recipehub-audit-db
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${GRAFANA_DB_USER}
    database: ${AUDIT_DB_NAME}
    isDefault: true
    editable: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      sslmode: "disable"
      postgresVersion: 1600
      timescaledb: false

  - name: RecipeHub Identity DB
    uid: recipehub-identity-db
